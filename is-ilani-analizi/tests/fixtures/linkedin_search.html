<html><body>
<div class="modal__overlay--visible" id="modal" style="position:fixed;top:0;left:0;width:300px;height:100px;background:#eee">
 <button class="modal__dismiss" onclick="document.getElementById('modal').remove()">Kapat</button></div>
<ul class="jobs-search__results-list" id="list"></ul>
<div style="height:1500px"></div>
<button class="infinite-scroller__show-more-button" id="more">Daha fazla iş ilanı göster</button>
<script>
let n=0; const total=12;
function add(k){ const L=document.getElementById('list');
 for(let i=0;i<k && n<total;i++,n++){ const id=4480000000+n;
  L.insertAdjacentHTML('beforeend', `<li><div class="base-card job-search-card" data-entity-urn="urn:li:jobPosting:${id}">
   <a class="base-card__full-link" href="https://tr.linkedin.com/jobs/view/test-job-${id}?position=1"></a>
   <div class="base-search-card__info"><h3 class="base-search-card__title"> Junior Python Developer ${n} </h3>
   <h4 class="base-search-card__subtitle"><a>Firma ${n}</a></h4>
   <div class="base-search-card__metadata"><span class="job-search-card__location"> Kadıköy, İstanbul, Türkiye </span>
   <time class="job-search-card__listdate" datetime="2026-11-0${(n%9)+1}">1 hafta önce</time></div></div></div></li>`);}
 if(n>=total) document.getElementById('more').style.display='none'; }
add(5);
document.getElementById('more').onclick=()=>setTimeout(()=>add(4),300);
</script></body></html>
